<div class="card h-100 shadow-sm">
  <a [routerLink]="['/listings', listing.listing_id]" class="text-decoration-none text-dark">
    <div class="row g-0">
      <div class="col-4">
        @if (listing.thumbnailUrl) {
        <img
          class="card-img-top h-100"
          [src]="listing.thumbnailUrl"
          [alt]="listing.title ?? 'Immobile'"
          style="object-fit: cover"
        />
        } @else {
        <div class="card-img-top bg-light d-flex align-items-center justify-content-center h-100">
          <span class="text-muted"><i class="bi bi-image me-1"></i> Nessuna immagine</span>
        </div>
        }
      </div>
      <div class="col-8">
        <div class="card-body">
          <h5 class="card-title">{{ listing.title }}</h5>
          <p class="card-subtitle text-muted mb-2">
            <i class="bi bi-geo-alt me-1"></i>{{ listing.address }}
          </p>
          <h4 class="text-primary">{{ listing.price | number : '1.0-0' }} €</h4>
          <div class="d-flex justify-content-around mt-3 text-center">
            <div><i class="bi bi-rulers me-1"></i>{{ listing.area }} m²</div>
            <div><i class="bi bi-door-open me-1"></i>{{ listing.rooms }}</div>
            <div><i class="bi bi-droplet me-1"></i>{{ listing.bathrooms }}</div>
          </div>
        </div>
      </div>
    </div>
  </a>
</div>
