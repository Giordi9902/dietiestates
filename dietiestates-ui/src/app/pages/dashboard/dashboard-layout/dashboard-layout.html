<div class="container-fluid py-3">
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-12 col-md-3 col-lg-2 mb-3 mb-md-0">
      <div class="card shadow-sm">
        <div class="card-body p-0">
          <ul class="list-group list-group-flush">
            <li class="list-group-item">
              <a
                class="d-flex align-items-center gap-2 text-decoration-none"
                routerLink="/dashboard/homepage"
                routerLinkActive="fw-semibold"
              >
                <span class="bi bi-house"></span>
                <span>Homepage</span>
              </a>
            </li>
            <li class="list-group-item">
              <a
                class="d-flex align-items-center gap-2 text-decoration-none"
                routerLink="/dashboard/listings"
                routerLinkActive="fw-semibold"
              >
                <span class="bi bi-card-list"></span>
                <span>Gestione annunci</span>
              </a>
            </li>
            @if(isAdmin()){
            <li class="list-group-item">
              <a
                class="d-flex align-items-center gap-2 text-decoration-none"
                routerLink="/dashboard/agents"
                routerLinkActive="fw-semibold"
              >
                <span class="bi bi-people"></span>
                <span>Gestione agenti</span>
              </a>
            </li>
            }
          </ul>
        </div>
      </div>
    </nav>

    <!-- Content -->
    <main class="col-12 col-md-9 col-lg-10">
      <div class="card shadow-sm">
        <div class="card-body p-3 p-md-4">
          <router-outlet></router-outlet>
        </div>
      </div>
    </main>
  </div>
</div>
