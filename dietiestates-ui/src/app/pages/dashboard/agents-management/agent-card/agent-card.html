<div class="card h-100">
  <div class="card-body d-flex flex-column">
    <h6 class="card-title mb-1">{{ agent.firstName }} {{ agent.lastName }}</h6>
    <div class="text-muted small mb-2">{{ agent.email }}</div>
    <div class="small mb-3">
      @for (r of agent.roles; track $index) {
      <span class="badge bg-secondary me-1">{{ r.name }}</span>
      }
    </div>
    <div class="mt-auto d-flex gap-2">
      @if (!hasRoleAdmin() && agent.email !== currentUserEmail) {
      <button class="btn btn-outline-primary btn-sm" (click)="onPromote()">Promuovi</button>
      } @if (agent.email !== currentUserEmail && !hasRoleAdmin()) {
      <button class="btn btn-outline-danger btn-sm" (click)="onRemove()">Elimina</button>
      }
    </div>
  </div>
</div>
