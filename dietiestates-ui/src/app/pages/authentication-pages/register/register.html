<div class="container py-4 my-4">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow">
        <div class="card-body p-3 p-md-4">
          <h3 class="text-center mb-3">Registrati</h3>
          <p class="text-center text-muted mb-4">Crea il tuo account per iniziare</p>

          @if(errorMsg.length>0){
          <div class="alert alert-danger" role="alert">
            @for(error of errorMsg; track $index){
            <p class="mb-1">{{ error }}</p>
            }
          </div>
          }

          <form>
            <div class="form-floating mb-3">
              <input
                [(ngModel)]="registrationRequest.firstname"
                type="text"
                class="form-control"
                id="firstname"
                name="firstname"
                placeholder="Mario"
                required
              />
              <label for="firstname">Nome</label>
            </div>

            <div class="form-floating mb-3">
              <input
                [(ngModel)]="registrationRequest.lastname"
                type="text"
                class="form-control"
                id="lastname"
                name="lastname"
                placeholder="Rossi"
                required
              />
              <label for="lastname">Cognome</label>
            </div>

            <div class="form-floating mb-3">
              <input
                [(ngModel)]="registrationRequest.email"
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="name@example.com"
                required
              />
              <label for="email">Email</label>
            </div>

            <div class="form-floating mb-3">
              <input
                [(ngModel)]="registrationRequest.password"
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="password"
                required
              />
              <label for="password">Password</label>
            </div>

            <div class="d-grid gap-2">
              <div class="form-check mb-2">
                <input
                  [(ngModel)]="acceptedPrivacy"
                  class="form-check-input"
                  type="checkbox"
                  id="privacyCheck"
                  name="privacyCheck"
                />
                <label class="form-check-label" for="privacyCheck">
                  Confermo di aver letto l'
                  <a routerLink="/privacy" target="_blank">Informativa sulla Privacy</a>
                </label>
              </div>

              <button
                type="button"
                (click)="register()"
                class="btn btn-success btn-lg"
                [disabled]="!acceptedPrivacy"
              >
                <i class="bi bi-person-plus me-2" aria-hidden="true"></i>Registrati
              </button>
            </div>
          </form>

          <div class="text-center mt-3">
            <small class="text-muted">Hai già un account?</small>
            <a (click)="login()" class="btn btn-link">Accedi</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
