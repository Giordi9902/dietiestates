<div class="container py-4 my-4">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow">
        <div class="card-body p-3 p-md-4">
          <h3 class="text-center mb-3">Accedi</h3>
          <p class="text-center text-muted mb-4">Inserisci le tue credenziali per continuare</p>

          @if(successMsg){
          <div class="alert alert-success" role="alert">
            {{ successMsg }}
          </div>
          } @if(errorMsg.length>0){
          <div class="alert alert-danger" role="alert">
            @for(errorMessage of errorMsg; track $index){
            <p class="mb-1">{{ errorMessage }}</p>
            }
          </div>
          }

          <form>
            <div class="form-floating mb-3">
              <input
                [(ngModel)]="authRequest.email"
                type="email"
                class="form-control"
                id="login"
                name="email"
                placeholder="name@example.com"
                required
              />
              <label for="login">Email address</label>
            </div>

            <div class="form-floating mb-3">
              <input
                [(ngModel)]="authRequest.password"
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="password"
                required
              />
              <label for="password">Password</label>
            </div>

            <div class="d-grid gap-2">
              <button (click)="login()" type="button" class="btn btn-primary btn-lg">
                <i class="fas fa-sign-in-alt me-2"></i>Sign in
              </button>
            </div>
          </form>

          <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1" />
            <span class="px-3 text-muted">oppure</span>
            <hr class="flex-grow-1" />
          </div>

          <div class="d-grid gap-2">
            <a
              href="http://localhost:8080/api/v1/oauth2/authorization/google"
              class="btn btn-outline-danger"
            >
              <i class="fab fa-google me-2"></i> Accedi con Google
            </a>
            <a
              href="http://localhost:8080/api/v1/oauth2/authorization/github"
              class="btn btn-outline-dark"
            >
              <i class="fab fa-github me-2"></i> Accedi con GitHub
            </a>
          </div>

          <div class="text-center mt-3">
            <small class="text-muted">Non hai un account?</small>
            <button (click)="register()" type="button" class="btn btn-link">Registrati</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
