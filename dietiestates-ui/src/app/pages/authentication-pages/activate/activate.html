<div class="container py-4 my-4">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow">
        <div class="card-body p-3 p-md-4">
          <h3 class="text-center mb-3">Attiva account</h3>
          @if (submitted && isOkay) {
          <div class="alert alert-success" role="alert">{{ message }}</div>
          <div class="text-center">
            <button class="btn btn-primary" (click)="redirectToLogin()">Accedi</button>
          </div>
          } @else { @if (submitted && !isOkay) {
          <div class="alert alert-danger" role="alert">{{ message }}</div>
          }
          <div class="text-center">
            <p class="text-center text-muted mb-4">Inserisci il codice ricevuto via email</p>
            <code-input
              [isCodeHidden]="false"
              [codeLength]="6"
              [code]="'number'"
              (codeCompleted)="onCodeCompleted($event)"
            ></code-input>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
