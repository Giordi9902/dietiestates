logging:
  level:
    root: INFO
    it.unina.ingsw.dietiestates_backend: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%t]){faint} %clr(%5p){yellow} %clr(%logger{36}){cyan} - %msg%n%wEx"
spring:
  application:
    name: dietiestates-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
springdoc:
  default-produces-media-type: application/json
server:
  servlet:
    context-path: /api/v1/

management:
    endpoints:
        web:
            exposure:
              include: health,env,metrics, beans,loggers

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
  region: ${AWS_REGION}
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}