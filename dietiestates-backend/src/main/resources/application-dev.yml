spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/dietiestates}
        username: ${POSTGRES_USER:postgres}
        password: ${POSTGRES_PASSWORD:postgres}
    jpa:
        hibernate:
            dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                format_sql: false
        database: POSTGRESQL
        database-platform: org.hibernate.dialect.PostgreSQLDialect
    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    trust: "*"
                auth: true
                starttls:
                    enable: true
                connectiontimeout: 5000
                timeout: 5000
                writetimeout: 5000

application:
    security:
        jwt:
            secret-key: ${JWT_SECRET_KEY:XApjPlbTpOq+Pt7ANlYILkeAuZlzzt0hbPiT3Wny6Mg=}
            expiration: 8640000
            refresh-expiration: 2592000000
    mailing:
        frontend:
            login-url: http://localhost:4200/login
            activation-url: http://localhost:4200/activate