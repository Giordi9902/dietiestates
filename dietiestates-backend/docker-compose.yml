services:
  postgres:
    image: postgis/postgis
    container_name: postgres-dietiestates
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    volumes:
      - "postgres_data:${PGDATA}"
    ports:
      - 5433:5432
    networks:
      - dietiestates_network
    restart: unless-stopped

  mail-dev:
    container_name: mail-dev-dietiestates
    image: maildev/maildev
    ports:
      - 1080:1080
      - "${MAIL_PORT}:1025"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
networks:
  dietiestates_network:
    driver: bridge